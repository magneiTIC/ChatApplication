<div class="container-fluid">
  <div class="row">
    <div class=" col-md-3 col-lg-2 d-md-block bg-light sidebar fixed-top" style="height: 100%">
      <app-sidebar></app-sidebar>
    </div>
    <div class=" col-md-9 col-lg-10 ms-sm-auto px-md-3 p-0 m-0" >
      <div class="test w-100 h-100 d-flex flex-column" style="height: 120vh">
        <div class="main-panel">
          <div class="content-wrapper align-items-center "  style="height: 100%">
            <div class="row">
              <div class="col-lg-12 grid-margin stretch-card">
                <div class="card">
                  <div class="card-body">
                    <h4 class="card-title">Liste des agents </h4>

                    <div class="table-responsive">
                      <table class="table table-hover">
                        <thead>
                          <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Division</th>
                            <th>Statut</th>


                          </tr>
                        </thead>
                        <tbody *ngFor="let agent of agents | async ">
                          <tr>
                            <td> {{agent.username}}</td>
                            <td>{{agent.email}}</td>
                            <td>{{agent.division}}</td>
                            <td>{{agent.status}}</td>
                            <td>
                              <button [routerLink]="['/info',agent.uid]" type="button"
                                class="btn btn-inverse-primary btn-sm btn-rounded btn-icon"
                                >
                                Voir plus
                              </button>

                            </td>
                          </tr>

                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>

            </div>
        </div>
      </div>
      </div>
    </div>
  </div>
</div>
