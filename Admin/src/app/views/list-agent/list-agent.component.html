<div class="container-fluid">
  <div class="row">    
    <div class=" col-md-3 col-lg-2 d-md-block bg-light sidebar" style="height: 120vh;">
      <app-header></app-header>
    </div>
    <div class=" col-md-9 col-lg-10 ms-sm-auto px-md-3">
      <div class="row mt-4">
        <div class="main-panel">
          <div class="content-wrapper">
            <div class="row">
              <div class="col-lg-12 grid-margin stretch-card">
                <div class="card">
                  <div class="card-body">
                    <h4 class="card-title">Liste des agents </h4>

                    <div class="table-responsive">
                      <table class="table table-hover">
                        <thead>
                          <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Division</th>
                          </tr>
                        </thead>
                        <tbody *ngFor="let agent of agents | async ">
                          <tr>
                            <td> {{agent.username}}</td>
                            <td>{{agent.email}}</td>
                            <td>{{agent.division}}</td>
                          </tr>

                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
