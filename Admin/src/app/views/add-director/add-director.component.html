<div class="container-scroller">

  <app-header></app-header>
  <div class="main-panel">        
    <div class="content-wrapper">
      <div class="row">
        <div class="col-md-6 grid-margin stretch-card" >
          <div class="card">
            <div class="card-body">
              <h4 class="card-title">Ajoutez un Directeur</h4>
              <form class="forms-sample"  [formGroup]="addDirectorForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                  <label for="exampleInputEmail">Email </label>
                  <input type="email" class="form-control" id="exampleInputEmail" formControlName="email" placeholder="Email">
                </div>
                <div class="form-group">
                  <label for="exampleInputEmail1">Confirmez l'email</label>
                  <input type="email" class="form-control" id="exampleInputEmail1"formControlName="email1" placeholder="Confirmez l'email">
                </div>

                <div class="form-group">
                  <label for="exampleInputDivision">Division</label>
<br>
                      <label class="form-check-label">
                        <input type="radio" class="form-check-input" formControlName="division" id="optionsRadios1" value="Police judiciaire" >
                        Police judiciaire
                      </label><br>
                 
                      <label class="form-check-label">
                        <input type="radio" class="form-check-input" formControlName="division" id="optionsRadios2" value="Surveillance du territoire">
                        Surveillance du territoire
                      </label><br>
                  
                      <label class="form-check-label">
                        <input type="radio" class="form-check-input" formControlName="division" id="optionsRadios3" value="Sécurité Publique" >
                        Sécurité Publique
                      </label>
              </div>
             <button type="submit" class="btn btn-primary me-2">Valider</button>
              </form>
            </div>
          </div>
        </div>
      
      </div>
    </div>
  </div>
</div>
