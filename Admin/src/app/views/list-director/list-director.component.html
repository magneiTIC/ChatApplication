<div class="container-scroller">
  <div class="row">
    <div class=".col-6 .col-md-4">
      <app-sidebar></app-sidebar>

    </div>
    <div class=".col-md-8 ">
      <div class="main-panel">
        <div class="content-wrapper">
          <div class="row"> 
            <div class="col-lg-12 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <h4 class="card-title">Liste des directeurs </h4>
                  
                  <div class="table-responsive">
                    <table class="table table-hover">
                      <thead>
                        <tr>
                          <th>Username</th>
                          <th>Email</th>
                          <th>Division</th>
                          <th></th>
                        </tr>
                      </thead>
                      <tbody *ngFor="let director of directors | async ">
                        <tr>
                          <td> {{director.username}}</td>
                          <td>{{director.email}}</td>
                          <td>{{director.division}}</td>
                          <td>
                            <button [routerLink]="['/info',director.uid]" type="button"
                              class="btn btn-inverse-primary btn-sm btn-rounded btn-icon"
                              >
                              Voir plus
                            </button>
  
                          </td>
                        </tr>
                       
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>                
           
          </div>
        </div>
        
      </div>
    </div>
  </div>

 
</div>
