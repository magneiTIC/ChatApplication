            <<ng-container *ngIf="messages | async as messages; let i = index">
    <div>
      <div class="message-bubble-container" [ngClass]="{'sender': message.user.uid === currentUserId}">
        <div class="message-bubble">
          {{ message.content }}
          <span class="chat-time">{{ message.sentAt | date: 'HH:mm' }}</span>
        </div>
      </div>
      <hr class="message-date-line" *ngIf="isNewDate(messages, i)" />
    </div>
    <div hidden #endOfChat></div>
  </ng-container>
            <!-- Afficher les messages ici -->
        </div>
        <div class="chat-input">
            <mat-form-field appearance="outline">
                <input matInput [formControl]="messageControl" placeholder="Écrivez votre message..."
                    (keydown.enter)="sendMessage()" />
                <a matSuffix href="" (click)="sendMessage()">
                    <mat-icon matSuffix class="icon"> attach_file</mat-icon>
                </a>
                &nbsp;
                <a matSuffix href="" (click)="sendMessage()">
                    <mat-icon matSuffix class="icon">send</mat-icon>
                </a>
                <div matSuffix> </div>

            </mat-form-field>


        </div>
    </div>
</div>
