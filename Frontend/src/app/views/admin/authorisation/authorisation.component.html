<div class="chat-app">
	<app-side></app-side>
	
	<div class="col">
	  <div class="row my-4">
		<div class="card-container">
		  <div class="card">
			<div class="card-header pb-0 text-center">
			  <h1>Autorisaton de discuter </h1>
	
			  <div class="row">
				<div class="card-body">
				  <form role="form text-left "   [formGroup]="authForm" (ngSubmit)="onSubmit()">
					<div class="mb-3">
					  <input type="email" class="form-control" formControlName="email" placeholder=" Email de mon agent" 
						aria-label=" Email de mon agent" aria-describedby="email-addon">
					</div>
					
					<div class="mb-3">
					  <input type="email" class="form-control" formControlName="email1" placeholder="Email de l'autre agent " 
						aria-label="Email de l'autre agent " aria-describedby="email-addon">
					</div>
	
					<div class="text-center">
					  <button type="submit" class="btn bg-gradient-info w-100 my-4 mb-2">Valider</button>
					</div>
				  </form>
				</div>
			  </div>
			</div>
	
		  </div>
		</div>
	
	  </div>
	</div>
  </div>
