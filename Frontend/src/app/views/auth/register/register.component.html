<div class="chat-app">	
	<div class="col">
	  <div class="row my-4">
		<div class="card-container">
		  <div class="card">
			<div class="card-header pb-0">
			  <h1>Continuez votre inscription </h1>
	
			  <div class="row">
				<div class="card-body">
				  <form role="form text-left " [formGroup]="registerForm" (ngSubmit)="onSubmit()" >
                    <div class="mb-3">
                        <input type="text" class="form-control" formControlName="username" placeholder="Username" 
                          aria-label=" Username" aria-describedby="text-addon">
                      </div>

					<div class="mb-3">
                        <input type="password" class="form-control" formControlName="password" placeholder="Saisir le mot de passe" 
                          aria-label="Saisir le mot de passe" aria-describedby="password-addon">
                      </div>
					<div class="mb-3">
					  <input type="password" class="form-control" formControlName="password1" placeholder="Confirmer le mot de passe" 
						aria-label="Confirmer le mot de passe" aria-describedby="password-addon">
					</div>
	
					<div class="text-center">
					  <button type="button" class="btn bg-gradient-info w-100 my-4 mb-2">Valider</button>
					</div>

				  </form>
				</div>
			  </div>
			</div>
	
		  </div>
		</div>
	
	  </div>
	</div>
  </div>
