<div class="chat-app">
	<app-side></app-side>
    <div class="chat-app">

    <div class="sidebar">
        <!-- Barre latérale avec la liste des contacts -->
        <div class="sidebar-header">
            <h2>Contacts </h2> 
            <div class="search-input">               
                <input 
                matInput
                images-placeholder="Rechercher"
                [matAutocomplete]="userss"
                class="form-control"
                placeholder="Rechercher  ..."                >
              
                <mat-autocomplete #userss="matAutocomplete">
                    <mat-option 
                    *ngFor="let user of users "
                    [value]="''"
                    >
                    {{ user.username}}
                </mat-option>
                </mat-autocomplete>
            </div>
        </div>
                <ul class="contact-list"  *ngFor="let user of users " >

            <li class="contact-item">
                <img [src]="'assets/images/images-placeholder.png'" alt="Contact 1" class="contact-avatar" />
                <div class="contact-details">
                    <p mat-line class="chat-title">
                        <span class="chat-name">
                            {{user.username}}
                        </span>
                    
                </div>
            </li>         
        </ul>
    </div>
   </div>
</div>
