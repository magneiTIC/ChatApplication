<div class="chat-app">

    <div class="chat-container " *ngIf="chat.username">
        <!-- Interface de chat avec une conversation -->
        <div class="chat-header">
          <img [src]="'assets/images/images-placeholder.png'" alt="">
          <h2 *ngIf="chat.username">{{ chat.username }}</h2>
        </div>
        <ng-template #noMessage>

        </ng-template>
        <mat-divider></mat-divider>
        <div class="chat-messages" #messageContainer (scroll)="onScroll($event)">
            <ng-container *ngIf="messages | async as messages">
              <ng-container *ngFor="let message of messages; let i = index">
                <div class="message-date" *ngIf="showDate && (i === 0 || !areDatesEqual(message.sentAt, messages[i - 1]?.sentAt))">
                  {{ message.sentAt | date: 'dd/MM/yyyy' }}
                </div>
                <hr class="message-date-line" *ngIf="showDate && (i === 0 || !areDatesEqual(message.sentAt, messages[i - 1]?.sentAt))" />
                <div class="message-bubble-container" [ngClass]="{'sender': message.user=== currentUserUid}">
            
                  <div class="message-bubble">
                    {{ message.content }}
                    <span class="chat-date">
                      {{ message.sentAt | date: 'HH:mm' }}
                    </span>
                  </div>
                </div>
              </ng-container>
            </ng-container>
          </div>
          
        <div class="chat-input">
            <mat-form-field appearance="outline">
                <input matInput [formControl]="messageControl" placeholder="Écrivez votre message..."
                    (keydown.enter)="sendMessage()" />
                <a matSuffix (click)="sendMessage()">
                    <mat-icon matSuffix class="icon"> attach_file</mat-icon>
                </a>
                &nbsp;
                <a matSuffix (click)="sendMessage()">
                    <mat-icon matSuffix class="icon">send</mat-icon>
                </a>
                <div matSuffix> </div>

            </mat-form-field>


        </div>
        <!-- <div class="chat-input">
          <mat-form-field appearance="outline">
            <input matInput [formControl]="messageControl" placeholder="Écrivez votre message..." (keydown.enter)="sendMessage()" />
            <a matSuffix href="javascript:void(0);" (click)="sendMessage()">
              <mat-icon matSuffix class="icon">send</mat-icon>
            </a>
          </mat-form-field>
        </div> -->
    </div>
    <img *ngIf="!chat.username" src="assets/images/chat.png" alt="">
</div>
