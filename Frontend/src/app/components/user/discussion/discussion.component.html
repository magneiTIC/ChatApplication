<div class="chat-app">

    <div class="sidebar">
        <!-- Barre latérale avec la liste des contacts -->
        <div class="sidebar-header">
            <h2>Discussions </h2>
            <div class="search-input">
                <input matInput images-placeholder="Rechercher" [matAutocomplete]="userss" class="form-control"
                    placeholder="Rechercher  ...">

                    <mat-autocomplete #userss="matAutocomplete">
                        <mat-option *ngFor="let user of users | async" [value]="user.username">
                          {{ user.username }}
                        </mat-option>
                      </mat-autocomplete>
            </div>
        </div>
         <ul class="contact-list" *ngFor="let chat of myChats | async">

            <li class="contact-item" (click)="selectChat(chat.chatId, chat.users[0].username,chat.sharedKey)">
                <img [src]="'assets/images/images-placeholder.png'" alt="Contact 1" class="contact-avatar" />
                <div class="contact-details">
                    <p mat-line class="chat-title">
                        <span class="chat-name">
                            {{chat.users[0].username}}
                        </span>
                        <span class="chat-date">
                            {{chat.lastMessage.sentAt}}
                        </span>
                        <span class="unread-badge" *ngIf="chat.lastMessage.unreadMessages !=0 && currentUserUid!=chat.users[0].uid ">{{chat.lastMessage.unreadMessages}}</span>

                    </p>
                    <p mat-line>
                        {{chat.lastMessage.content}}
                    </p>

                </div>
            </li>
            <!-- Ajoutez d'autres contacts ici -->
        </ul>
    </div>

</div>
